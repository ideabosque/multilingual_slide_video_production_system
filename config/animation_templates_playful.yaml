    - {role: title, effect: words, position: 0.05, ease: "back.out(3)", params: {y: 80, rotation: 14, scale: 0.6, stagger: 0.04}}
    - {role: title, effect: accent_line, position: ">-0.25"}
    - {id: panels, role: nodes, min_count: 2, effect: beats, ease: "back.out(3.2)", params: {from: 0.06, to: 0.22, first_max: 0.7, rotation: 10, scale: 0.15, y: 70}}
    - {role: body, effect: beats, skip_if_ran: panels, ease: "back.out(3)", params: {from: 0.08, to: 0.4, first_max: 0.8, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

timeline_roadmap:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: title, effect: words, position: 0.05, ease: "back.out(3)", params: {y: 80, rotation: 14, scale: 0.6, stagger: 0.04}}
    - {role: title, effect: accent_line, position: ">-0.25"}
    - {id: steps, role: nodes, min_count: 2, effect: beats, ease: "back.out(3)", params: {from: 0.08, to: 0.55, first_max: 0.8, y: 70, scale: 0.3, rotation: 6}}
    - {role: body, effect: beats, skip_if_ran: steps, ease: "back.out(3)", params: {from: 0.08, to: 0.55, first_max: 0.8, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}
