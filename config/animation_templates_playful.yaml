# Playful motion style - the same 8 template names as
# config/animation_templates.yaml (the calm style), so a deck's spec.json
# works with either. Selected by config/motion.yaml's `animation_style`.
#
# What makes it playful, compared to the calm style's half-second fade
# followed by a static hold:
# - springy eases with one clean overshoot (back.out) - no elastic wobble;
# - kinetic headlines: words (or CJK characters) bounce in one by one;
# - content keeps arriving while the narrator talks: `beats` spreads cards,
#   bullets and list items across the slide ("beat:<fraction>" positions are
#   fractions of the slide's narration-driven duration);
# - nothing ever freezes: a slow, steady camera push-in (`drift`) on the whole
#   slide. Landed elements hold still: continuous bobbing read as shaking;
# - a quick `exit` just before each cut, so slides hand off instead of
#   snapping.
# Tuned more energetic on 2026-10-22 (bigger overshoot and movement, faster
# staggers, content landing earlier). Then calmed (same day): no ambient
# float or elastic wobble - landed objects should not shake.
#
# Step schema: see config/animation_templates.yaml's header. Effects added
# for this style (implemented in slides/assets/animation_runtime.js):
#   pop    - scale-in with overshoot. params: scale, y, x, rotation, stagger
#   words  - per-word (per-char for CJK) bounce-in. params: y, rotation, scale, stagger
#   beats  - items pop in one by one between two fractions of the slide; the
#            first never waits more than first_max seconds (default 1.2).
#            params: from, to (fractions), first_max, scale, y, rotation (alternates sign)
#   float  - ambient bob (available, deliberately unused: it read as shaking).
#   drift  - slow push-in on the whole slide for its full length. params: scale
#   exit   - fade-up just before the cut (opacity + y). params: y
# `count_up` takes params.pop: true for a springy scale-in entrance.
# Role `slide` is the whole slide (camera moves and exits).

title_reveal:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: title, effect: words, position: 0.1, ease: "back.out(3)", params: {y: 90, rotation: 16, scale: 0.6, stagger: 0.05}}
    - {role: title, effect: accent_line, position: ">-0.3"}
    - {role: subtitle, effect: pop, position: ">-0.15", ease: "back.out(3)", params: {y: 40, scale: 0.4}}
    - {id: cards, role: nodes, min_count: 2, effect: beats, ease: "back.out(3)", params: {from: 0.08, to: 0.3, first_max: 0.8, scale: 0.2, y: 60, rotation: 7}}
    - {role: body, effect: beats, skip_if_ran: cards, ease: "back.out(3)", params: {from: 0.12, to: 0.4, first_max: 0.9, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

feature_callout:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: title, effect: words, position: 0.05, ease: "back.out(3)", params: {y: 80, rotation: 14, scale: 0.6, stagger: 0.04}}
    - {role: title, effect: accent_line, position: ">-0.25"}
    - {role: subtitle, effect: pop, position: ">-0.15", ease: "back.out(3)", params: {y: 36, scale: 0.4}}
    - {id: cards, role: nodes, min_count: 2, effect: beats, ease: "back.out(3)", params: {from: 0.08, to: 0.45, first_max: 0.8, scale: 0.2, y: 60, rotation: 7}}
    - {role: body, effect: beats, skip_if_ran: cards, ease: "back.out(3)", params: {from: 0.08, to: 0.45, first_max: 0.8, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

stat_highlight:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: [stat, title], effect: count_up, position: 0.1, params: {pop: true, scale: 0.1}}
    - {role: title, effect: words, position: 0.05, ease: "back.out(3)", params: {y: 70, rotation: 12, scale: 0.6, stagger: 0.04}}
    - {role: subtitle, effect: pop, position: "beat:0.06", ease: "back.out(3)", params: {y: 36, scale: 0.4}}
    - {id: cards, role: nodes, min_count: 2, effect: beats, ease: "back.out(3)", params: {from: 0.1, to: 0.4, first_max: 1.0, scale: 0.2, y: 60, rotation: 7}}
    - {role: body, effect: beats, skip_if_ran: cards, ease: "back.out(3)", params: {from: 0.1, to: 0.4, first_max: 1.0, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

diagram_build:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: title, effect: words, position: 0.05, ease: "back.out(3)", params: {y: 80, rotation: 14, scale: 0.6, stagger: 0.04}}
    - {role: title, effect: accent_line, position: ">-0.25"}
    - {id: diagram_nodes, role: nodes, min_count: 2, effect: beats, ease: "back.out(3.2)", params: {from: 0.08, to: 0.5, first_max: 0.8, rotation: 9, scale: 0.15, y: 70}}
    - {role: diagram, effect: pop, position: "beat:0.08", skip_if_ran: diagram_nodes, ease: "back.out(2.5)", params: {scale: 0.3}}
    - {role: body, effect: beats, ease: "back.out(3)", params: {from: 0.12, to: 0.55, first_max: 1.0, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

closing:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: title, effect: words, position: 0.05, ease: "back.out(3.4)", params: {y: 100, rotation: 18, scale: 0.5, stagger: 0.06}}
    - {role: title, effect: accent_line, position: ">-0.25"}
    - {role: cta, effect: pop, position: ">", params: {scale: 0.1}, ease: "back.out(2.5)"}
    - {id: cards, role: nodes, min_count: 2, effect: beats, ease: "back.out(3)", params: {from: 0.08, to: 0.4, first_max: 0.8, scale: 0.2, y: 60, rotation: 7}}
    - {role: body, effect: beats, skip_if_ran: cards, ease: "back.out(3)", params: {from: 0.08, to: 0.4, first_max: 0.8, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

quote_testimonial:
  steps:
    - {role: slide, effect: drift, params: {scale: 1.04}}
    - {role: title, effect: words, position: 0.1, ease: "back.out(2.6)", params: {y: 50, rotation: 8, scale: 0.7, stagger: 0.06}}
    - {role: subtitle, effect: pop, position: "beat:0.15", ease: "back.out(3)", params: {y: 30, scale: 0.4}}
    - {id: cards, role: nodes, min_count: 2, effect: beats, ease: "back.out(3)", params: {from: 0.2, to: 0.5, first_max: 1.5, scale: 0.2, y: 60, rotation: 7}}
    - {role: body, effect: beats, skip_if_ran: cards, ease: "back.out(3)", params: {from: 0.2, to: 0.5, first_max: 1.5, y: 40, scale: 0.6, rotation: 4}}
    - {role: slide, effect: exit, duration: fast, params: {y: -40}}

comparison_versus:
